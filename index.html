<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animal Farm – A Warning in Seven Commandments</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,900;1,500&family=Special+Elite&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--txt:#f6f0e6;--acc:#c8402f;--gl:rgba(14,12,10,.58);--bd:rgba(255,255,255,.16);--lb:rgb(242,230,208);--vg:rgba(0,0,0,.65)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1510;color:var(--txt);font-family:Georgia,'Times New Roman',serif}
#gl{position:fixed;inset:0;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%),linear-gradient(rgba(0,0,0,.35),transparent 30%,transparent 65%,rgba(0,0,0,.45))}
#grain{position:fixed;inset:-50%;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");animation:g .6s steps(4) infinite}
@keyframes g{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
#deck{position:fixed;inset:0;perspective:1600px;transform-style:preserve-3d;transition:transform .3s ease-out}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1.4rem;padding:2rem 2rem 5rem;text-align:center;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(30px) scale(.98);filter:blur(10px);transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.7,.2,1),filter 1s,visibility 0s 1.2s}
.slide.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none;transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.7,.2,1),filter 1s,visibility 0s}
/* centre content when it fits, scroll from the top when it does not */
.slide>:first-child{margin-top:auto}.slide>:last-child{margin-bottom:auto}
.slide.ovf{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
/* with a mouse the deck tilts in 3D; let clicks reach the content instead of the (coplanar) slide itself */
@media (hover:hover){#deck,.slide.on{pointer-events:none}.slide.on *{pointer-events:auto}}
.slide.on,.slide.on .op,.slide.on .op>div,.slide.on .tl{transform-style:preserve-3d}
.slide.past{transform:translateY(-30px) scale(1.02)}
.rv{opacity:0;transform:translateY(18px);transition:opacity 1.1s ease var(--d,0s),transform 1.1s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.on .rv{opacity:1;transform:translateZ(var(--z,0px))}.on h1.rv,.on h2.rv{--z:70px}.on .glass.rv{--z:45px}
h1,h2{font-family:'Playfair Display',Georgia,serif;margin:0;text-shadow:0 3px 24px rgba(0,0,0,.7)}
h1{font-size:clamp(3rem,11vw,8rem);font-weight:900;letter-spacing:.04em;line-height:1}
h2{font-size:clamp(1.8rem,4.6vw,3.2rem);font-weight:600}
.lbl{font-family:'Special Elite',monospace;letter-spacing:.35em;text-transform:uppercase;font-size:.8rem;opacity:.8}
.rule{height:2px;width:0;background:var(--acc);transition:width 1.4s cubic-bezier(.2,.7,.2,1) .4s}.on .rule{width:90px}
.sub{max-width:720px;font-size:clamp(1rem,2.2vw,1.35rem);line-height:1.65;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.glass{background:rgba(14,12,10,.58);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:1.5rem 2rem;box-shadow:0 30px 70px rgba(0,0,0,.5)}
em.q{font-family:'Playfair Display',serif;font-style:italic}
button{font-family:'Special Elite',monospace;letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;color:var(--txt);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.4);padding:.8rem 1.6rem;cursor:pointer;transition:.3s}
button:hover{background:var(--acc);border-color:var(--acc)}
#hud{position:fixed;left:0;right:0;bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:center;gap:1.2rem;align-items:center;font-family:'Special Elite',monospace;font-size:.8rem;letter-spacing:.2em}
#hud button{padding:.4rem .9rem}
#pr{position:fixed;left:0;bottom:0;height:3px;background:var(--acc);width:0;transition:width 1s;z-index:6}
/* commandments */
#wall{width:min(900px,100%);padding:2.2rem 2.4rem;text-align:left;border-radius:3px;background:repeating-linear-gradient(90deg,#1b1410 0 78px,#0c0907 78px 80px),#1b1410;box-shadow:inset 0 0 80px #000,0 30px 80px rgba(0,0,0,.7);font-family:'Special Elite',monospace;font-size:clamp(.95rem,2.2vw,1.45rem);line-height:2;color:#f3eee2;position:relative;overflow:hidden}
#wall div{opacity:.92}#wall #fin{opacity:0}
#wall b{font-weight:400;color:#e9d7a8;display:inline-block;clip-path:inset(0 100% 0 0);transition:clip-path 1.6s cubic-bezier(.4,0,.2,1)}
#wall b.in{clip-path:inset(0 0 0 0)}
#wall.fin div{opacity:0;transition:opacity 1.5s}
#fin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;font-size:clamp(1.4rem,4vw,2.8rem);opacity:0;transition:opacity 2s 1.2s;letter-spacing:.08em}
#wall.fin #fin{opacity:1}
/* cards */
#cards,#cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1.2rem;width:min(960px,100%);perspective:1200px}
.card{height:250px;cursor:pointer;transform-style:preserve-3d;transition:opacity 1.1s ease var(--d,0s),transform .15s ease-out}
.cin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.card.x .cin{transform:rotateY(180deg)}
.cin>div{position:absolute;inset:0;backface-visibility:hidden;padding:1.4rem;display:flex;flex-direction:column;justify-content:center;gap:.6rem;background:rgba(14,12,10,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);box-shadow:0 25px 50px rgba(0,0,0,.55)}
.cin .bk{transform:rotateY(180deg);border-color:var(--acc)}
.num{font-family:'Playfair Display',serif;font-size:2.6rem;opacity:.35}
/* chart */
#bars{display:flex;align-items:flex-end;gap:16px;height:220px;width:min(520px,80vw);border-bottom:1px solid rgba(255,255,255,.5)}
#bars i{flex:1;background:linear-gradient(#e0b34a,#8a5e1c);height:10%;transition:height 1.8s cubic-bezier(.2,.7,.2,1);box-shadow:0 0 30px rgba(0,0,0,.4)}
#bars.real i{background:linear-gradient(#a33,#511)}
/* opinions */
.op{display:grid;grid-template-columns:auto 1fr;gap:2rem;align-items:center;max-width:960px;text-align:left;padding:2rem 2.4rem;border-radius:10px;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,.38) 55%,rgba(0,0,0,0))}
.op .no{font-family:'Playfair Display',serif;font-size:clamp(5rem,16vw,12rem);line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.6)}
@media(max-width:700px){.op{grid-template-columns:1fr;text-align:center}.op .no{font-size:4rem}}
#cards2 .card{height:200px}#cards2{grid-template-columns:repeat(3,1fr);width:min(760px,100%)}
@media(max-width:560px){#cards,#cards2{grid-template-columns:repeat(2,1fr);gap:.8rem}.card,#cards2 .card{height:190px}.cin>div{padding:1rem}.cin h2{font-size:1.15rem!important}.cin p{font-size:.8rem!important}}
.tl{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;max-width:960px}.tl .glass{flex:1 1 220px;text-align:left}.tl p{margin:.5rem 0 0;line-height:1.55}
.cubew,.ringw{transform-style:preserve-3d;perspective:900px}
.cube{position:relative;width:190px;height:190px;margin:2.5rem auto;transform-style:preserve-3d;animation:spin 22s linear infinite}
.cube div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 1.6rem 'Playfair Display',serif;background:rgba(14,12,10,.72);border:1px solid rgba(255,255,255,.35)}
.cube div:nth-child(1){transform:translateZ(95px)}.cube div:nth-child(2){transform:rotateY(90deg) translateZ(95px)}.cube div:nth-child(3){transform:rotateY(180deg) translateZ(95px)}.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(95px)}.cube div:nth-child(5){transform:rotateX(90deg) translateZ(95px)}.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(95px)}
@keyframes spin{to{transform:rotateX(-360deg) rotateY(360deg)}}
.ring{--w:min(220px,40vw);--r:max(calc(var(--w)*.95),min(300px,34vw));position:relative;width:var(--w);height:260px;margin:2rem auto 3rem;transform-style:preserve-3d;animation:rg 30s linear infinite}.ring:hover{animation-play-state:paused}
.ring div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem;font:600 1.15rem 'Playfair Display',serif;line-height:1.3;background:rgba(14,12,10,.74);border:1px solid rgba(255,255,255,.28);transform:rotateY(calc(var(--i)*60deg)) translateZ(var(--r));backface-visibility:hidden}
@keyframes rg{from{transform:translateZ(calc(-1*var(--r))) rotateY(0)}to{transform:translateZ(calc(-1*var(--r))) rotateY(-360deg)}}
#coin{position:relative;width:230px;height:190px;margin:2rem auto 1rem;transform-style:preserve-3d;transition:transform .12s}
#coin div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 4.2rem 'Playfair Display',serif;letter-spacing:.1em;border:1px solid rgba(255,255,255,.4);backface-visibility:hidden;background:rgba(14,12,10,.85)}#coin .m{transform:rotateY(180deg);border-color:var(--acc);color:#f2c9c2}
input[type=range]{accent-color:var(--acc);width:min(300px,80vw)}
.slide.scr{overflow-y:auto;justify-content:flex-start;padding-top:2.4rem}
.sy{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;width:min(1100px,100%);perspective:1200px}
.sc{background:var(--gl);border:1px solid var(--bd);text-align:left;cursor:zoom-in;transform-style:preserve-3d;box-shadow:0 25px 50px rgba(0,0,0,.5);transition:opacity 1.1s ease var(--d,0s),transform .2s ease-out,box-shadow .3s}
.sc:hover{box-shadow:0 35px 80px rgba(0,0,0,.75)}
.sc .im{overflow:hidden}.sc img{display:block;width:100%;height:150px;object-fit:cover;transition:transform .9s}.sc:hover img{transform:scale(1.08)}
.sc .t{padding:.8rem 1rem 1rem;transform:translateZ(30px)}
.sc h3{margin:0 0 .4rem;font:600 1.15rem 'Playfair Display',serif}.sc p{margin:.25rem 0;font-size:.85rem;line-height:1.45}
.sc .cap{font-style:italic;opacity:.8;border-top:1px solid var(--bd);padding-top:.45rem;margin-top:.5rem}
.tc{display:flex;gap:1rem;align-items:center;text-align:left}.tc p{margin:0;font-size:.95rem}
.ico{width:92px;height:92px;flex:none;animation:cn 7s ease-in-out infinite;filter:drop-shadow(0 12px 14px rgba(0,0,0,.5))}
@keyframes cn{50%{transform:rotateY(180deg)}}
#lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;cursor:zoom-out;perspective:1200px}#lb.on{display:flex}
#lb img{max-width:92vw;max-height:88vh;box-shadow:0 30px 90px #000;animation:lz .6s cubic-bezier(.2,.7,.2,1)}@keyframes lz{from{transform:scale(.6) rotateY(40deg);opacity:0}}
#sp{position:fixed;right:1rem;top:1rem;bottom:4rem;width:min(390px,90vw);z-index:15;background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(14px);padding:1.2rem 1.4rem;overflow:auto;text-align:left;font-size:.95rem;line-height:1.6;transform:translateX(115%);transition:transform .7s cubic-bezier(.2,.7,.2,1)}#sp.on{transform:none}#sp p{margin:.6rem 0}
/* ===== staged theme: normal > dark > royal > blood red (driven by JS vars) ===== */
html,body{background:#14100c}
#vig{background:radial-gradient(ellipse at center,transparent 45%,var(--vg) 100%),linear-gradient(rgba(0,0,0,.35),transparent 30%,transparent 65%,rgba(0,0,0,.45))!important}
h1,h2{text-shadow:0 3px 24px rgba(0,0,0,.8)!important}
.lbl{color:var(--lb)}
.glass,.cin>div,.cube div,.ring div,#coin div{background:var(--gl)!important;border-color:var(--bd)!important}
.cin .bk,#coin .m{border-color:var(--acc)!important}
#bars i{background:linear-gradient(var(--acc),rgba(0,0,0,.7))!important}#bars.real i{background:linear-gradient(#777,#222)!important}
#wall b{color:var(--lb)}
button{border-color:var(--bd)}button:hover{box-shadow:0 0 24px var(--acc)}
.op .no{-webkit-text-stroke:1px var(--acc)}
</style>
</head>
<body>
<canvas id="gl"></canvas><div id="vig"></div><div id="grain"></div>
<div id="deck"></div>
<div id="pr"></div>
<div id="hud"><button id="pv">←</button><span id="ct"></span><button id="nx">→</button><button id="fs">Fullscreen</button></div>

<script>
/* ===== EDIT THE TEAM'S OPINIONS HERE ===== */
const people=[
 {n:'Rishabh',t:'Propaganda works because language can be rewritten.',o:'The most frightening thing in Animal Farm is not the violence but Squealer rewriting the Commandments overnight. Once the animals cannot trust their own memory, the pigs no longer need to argue; they only need to repeat.'},
 {n:'Yash',t:'A revolution is only as good as what follows it.',o:'Old Major\u2019s dream was sincere, and that is the tragedy. Orwell shows that an ideal without safeguards is a gift to whoever is clever enough to inherit it.'},
 {n:'Vaibhav',t:'Equality dies by small exceptions.',o:'Nobody abolishes equality in a day. A little milk, a few apples, a bed with sheets: each change sounds reasonable, until \u201Cequal\u201D quietly comes to mean \u201Csome are more equal than others\u201D.'},
 {n:'Shaunak',t:'Fear is a system of government.',o:'Napoleon\u2019s dogs show that power needs force to hold, and the animals\u2019 silence shows how quickly fear teaches obedience. A leader who cannot be questioned will eventually stop being a servant of the people.'},
 {n:'Sayanjeet',t:'A scapegoat is the cheapest policy.',o:'Snowball is blamed for every broken window and failed harvest. A regime that always has an enemy never has to answer for its own failures, which is why this device still feels so modern.'},
 {n:'Raktim',t:'The most loyal are the first to be sacrificed.',o:'Boxer gives everything and is sold for whisky money. For me his fate is the cruellest part: devotion without questioning is exactly what an unjust system feeds on.'}
];
const cards=[['Napoleon','The Dictator','Stalin','Seizes power with trained dogs and rules by fear.'],['Snowball','The Idealist','Trotsky','Planner of the windmill, then exiled and blamed for everything.'],['Boxer','The Labourer','The working class','Believes in hard work and trust. Is betrayed in the end.'],['Squealer','The Voice','State propaganda','Turns every lie into a statistic and every defeat into a victory.']];
const S=[];const deck=document.getElementById('deck');
/* speaker notes: SPEECH[key] is shown by any <button class="spb" data-sp="key"> */
const SPEECH={};document.body.insertAdjacentHTML('beforeend','<div id="lb"><img alt=""></div><aside id="sp" aria-live="polite"></aside>');
/* add(html, mood, {enter, steps, show}) - enter() runs each time the slide is shown;
   steps/show(n) give a slide click-through builds driven by → / PageDown before moving on */
const add=(h,mood,o={})=>{const s=document.createElement('section');s.className='slide';s.innerHTML=h;deck.appendChild(s);S.push({s,mood,step:0,...o});return s};
add(`<div class="lbl rv" style="--d:.3s">An English presentation</div><h1 class="rv" style="--d:.6s">ANIMAL FARM</h1><div class="rule"></div><p class="sub rv" style="--d:1s"><em class="q">A Fairy Story</em> that became a warning.</p>`,0);
add(`<div class="lbl rv">Setting the scene</div><h2 class="rv" style="--d:.2s">One Farm. One Warning.</h2><div class="tl"><div class="glass rv" style="--d:.4s"><div class="lbl">1945</div><p>George Orwell publishes Animal Farm as the Second World War comes to an end.</p></div><div class="glass rv" style="--d:.6s"><div class="lbl">Allegory</div><p>Every animal, event and slogan stands for something in the Russian Revolution.</p></div><div class="glass rv" style="--d:.8s"><div class="lbl">Satire</div><p>A simple farmyard fable that exposes how power corrupts and ideals are betrayed.</p></div></div>`,0);
add(`<div class="lbl rv">Chapter I</div><h2 class="rv" style="--d:.2s">Old Major\u2019s Dream</h2><div class="glass sub rv" style="--d:.4s;min-height:9.5em;width:min(640px,100%)"><em class="q" id="tw"></em></div><p class="lbl rv" style="--d:.8s">A utopia built on one idea: nobody should live off another\u2019s labour.</p>`,.08,{enter:type});
add(`<div class="lbl rv">Chapters II\u2013IV</div><h2 class="rv" style="--d:.2s">The Rebellion</h2><div class="tl"><div class="glass rv" style="--d:.4s"><div class="lbl">Neglect</div><p>Mr Jones drinks, stops caring, and forgets to feed the animals.</p></div><div class="glass rv" style="--d:.7s"><div class="lbl">Revolt</div><p>Starving, the animals drive Jones and his men off the farm.</p></div><div class="glass rv" style="--d:1s"><div class="lbl">New order</div><p>Manor Farm becomes Animal Farm and the Seven Commandments go up on the barn wall.</p></div></div>`,0);
add(`<div class="lbl rv">Chapters VI\u2013X \u00B7 How the law was changed</div><div id="wall" class="rv" style="--d:.3s"><div>1. Whatever goes upon two legs is an enemy.</div><div>2. Whatever goes upon four legs, or has wings, is a friend.</div><div>3. No animal shall wear clothes.</div><div>4. No animal shall sleep in a bed<b> with sheets</b>.</div><div>5. No animal shall drink alcohol<b> to excess</b>.</div><div>6. No animal shall kill any other animal<b> without cause</b>.</div><div>7. All animals are equal<b>, but some animals are more equal than others</b>.</div><div id="fin">FOUR LEGS GOOD,<br>TWO LEGS BETTER</div></div><button id="rw" class="rv" style="--d:.6s">Rewrite the wall</button>`,.3,{enter:resetWall});
add(`<div class="lbl rv">The ruling class</div><h2 class="rv" style="--d:.2s">Who Is Who</h2><div id="cards"></div><p class="lbl rv" style="--d:.9s">Tap a card to see who it represents</p>`,.45);
add(`<div class="lbl rv">Orwell\u2019s allegory</div><h2 class="rv" style="--d:.2s">The Farm and the Revolution</h2><div id="cards2"></div><p class="lbl rv" style="--d:1.2s">Tap a card to reveal its real-world counterpart</p>`,0);
add(`<div class="lbl rv">The great project</div><h2 class="rv" style="--d:.2s">The Windmill</h2><div class="cubew rv" style="--d:.4s"><div class="cube"><div>Hope</div><div>Labour</div><div>Blame</div><div>Sabotage</div><div>Profit</div><div>Power</div></div></div><p class="sub rv" style="--d:.8s">Built, destroyed and rebuilt. It promised comfort for everyone, and delivered only more work.</p>`,0);

function yashSlides(){
 const P=[['The Farm','farm',['Represents a society where power and resources are not equally distributed.'],'Transforms from a symbol of hope and equality into one of oppression and inequality.'],['The Pigs (Napoleon)','pig',['Symbolise a ruling class that becomes corrupt after gaining power.']],['Boxer','boxer',['Represents the hardworking ordinary workers.','Loyal and dedicated, but eventually exploited.']],['The Seven Commandments','cmd',['Represent the principles of equality in the revolution.','Later changed by the pigs to suit their own interests.'],'Their manipulation by the pigs demonstrates how laws can be altered to serve those in power.']];
 const T=[['Corruption of Power','crown','Leaders gain control and become like the very people they opposed.'],['Inequality','scales','Despite the promise of equality, a new hierarchy develops, with the pigs enjoying privileges while others continue to suffer.'],['Propaganda','mega','Manipulation of language and information to control the other animals and maintain power.']];
 const s1=add(`<div class="lbl rv">Yash\u2019s opinion \u00B7 Part 1</div><h2 class="rv" style="--d:.2s">Key Symbols</h2><div class="sy">${P.map((p,i)=>`<div class="sc rv" style="--d:${.4+i*.15}s"><div class="im"><img src="${IM[p[1]]}" alt="${p[0]}"></div><div class="t"><h3>${p[0]}</h3>${p[2].map(x=>`<p>\u2022 ${x}</p>`).join('')}${p[3]?`<p class="cap">${p[3]}</p>`:''}</div></div>`).join('')}</div><button class="spb rv" data-sp="yash" style="--d:1.2s">Show speech</button><p class="lbl rv" style="--d:1.3s;margin:0">Tap a picture to enlarge</p>`,0);
 s1.classList.add('scr');
 add(`<div class="lbl rv">Yash\u2019s opinion \u00B7 Part 2</div><h2 class="rv" style="--d:.2s">Major Themes</h2><div class="tl">${T.map((t,i)=>`<div class="glass rv tc" style="--d:${.4+i*.2}s"><img class="ico" src="${IM[t[1]]}" alt="${t[0]}"><div><h3 style="margin:0 0 .4rem;font:600 1.3rem 'Playfair Display',serif">${t[0]}</h3><p>${t[2]}</p></div></div>`).join('')}</div><div class="glass rv" style="--d:1.1s;max-width:640px"><em class="q">\u201CAll animals are equal, but some animals are more equal than others.\u201D</em><div class="lbl" style="margin-top:.5rem">\u2014 Animal Farm</div></div><p class="sub rv" style="--d:1.3s;margin:0">Through these symbols and themes, Orwell shows that a society cannot remain equal when its leaders are not held accountable.</p><button class="spb rv" data-sp="yash" style="--d:1.5s">Show speech</button>`,0);
 SPEECH.yash=`<div class="lbl">Yash\u2019s 1-minute speech</div><p>Now, I will talk about some important symbols and major themes in <em>Animal Farm</em>.</p><p>First, the farm itself represents a society where power and resources are not equally distributed.</p><p>The pigs, especially Napoleon, represent a ruling class that becomes corrupt after gaining power. Another important character is Boxer, the hardworking horse, who represents ordinary workers. Despite his loyalty and hard work, he is eventually exploited by the leaders.</p><p>The Seven Commandments are also an important symbol. They represent the principles of equality on which the revolution was built. However, as the pigs change these rules for their own benefit, they show those in power can manipulate laws and truth.</p><p>Through these symbols, Orwell highlights three major themes: corruption of power, inequality, and propaganda.</p><p>Overall, the book teaches us that a society cannot remain equal when its leaders are not held accountable for their actions.</p>`;
 const lb=document.getElementById('lb');
 s1.querySelectorAll('.sc').forEach(d=>{d.onmousemove=e=>{const r=d.getBoundingClientRect();d.style.transform=`rotateY(${((e.clientX-r.x)/r.width-.5)*16}deg) rotateX(${-((e.clientY-r.y)/r.height-.5)*16}deg)`};d.onmouseleave=()=>d.style.transform='';d.onclick=()=>{lb.firstElementChild.src=d.querySelector('img').src;lb.classList.add('on')}});
}
people.forEach((p,i)=>p.n=='Yash'?yashSlides():add(`<div class="op"><div class="no rv">0${i+1}</div><div><div class="lbl rv" style="--d:.2s">${p.n}\u2019s opinion</div><h2 class="rv" style="--d:.4s;margin:.6rem 0 1rem">${p.t}</h2><div class="rule" style="margin-bottom:1rem"></div><p class="sub rv" style="--d:.8s;margin:0">${p.o}</p></div></div>`,.65+i*.06));
add(`<div class="lbl rv">The final scene</div><h2 class="rv" style="--d:.2s">From Pig to Man</h2><div class="ringw rv" style="--d:.4s"><div id="coin"><div>PIG</div><div class="m">MAN</div></div></div><input type="range" id="mo" min="0" max="100" value="0" class="rv" style="--d:.6s"><p class="sub rv" style="--d:.8s" id="ml">Watching through the farmhouse window, the animals can no longer tell which is which.</p>`,0);
add(`<div class="lbl rv">Conclusion</div><h2 class="rv" style="--d:.3s;max-width:800px"><em class="q">\u201CAll animals are equal, but some animals are more equal than others.\u201D</em></h2><div class="rule"></div><p class="sub rv" style="--d:1.2s">Power rewrites the rules. Memory and questions are what keep us free.</p><p class="lbl rv" style="--d:1.6s">Thank you</p>`,1);
